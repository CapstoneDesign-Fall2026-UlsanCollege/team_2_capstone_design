<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211A10" />
      <stop offset="100%" stop-color="#120E08" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />
  <circle cx="400" cy="380" r="320" fill="url(#glow)" />

  <rect x="32" y="32" width="736" height="736" fill="none" stroke="#3A2C18" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Honey Glass Jar Illustration -->
  <g transform="translate(260, 160)">
    <!-- Jar lid -->
    <rect x="50" y="30" width="180" height="30" rx="6" fill="#B45309" stroke="#FBBF24" stroke-width="1.5" />
    <rect x="65" y="60" width="150" height="15" fill="#78350F" />
    <!-- Glass Jar -->
    <path d="M 40 75 Q 30 200 40 380 Q 40 410 70 410 L 210 410 Q 240 410 240 380 Q 250 200 240 75 Z" fill="#F59E0B" fill-opacity="0.25" stroke="#FBBF24" stroke-width="2" />
    <!-- Honey fill -->
    <path d="M 46 140 Q 140 150 234 140 L 235 380 Q 235 404 210 404 L 70 404 Q 45 404 45 380 Z" fill="#D97706" fill-opacity="0.75" />

    <!-- Label -->
    <rect x="60" y="180" width="160" height="160" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
    <text x="140" y="215" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#92400E" text-anchor="middle" letter-spacing="2">HIMALAYAN</text>
    <text x="140" y="245" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#78350F" text-anchor="middle">Wild Honey</text>
    <line x1="85" y1="260" x2="195" y2="260" stroke="#FCD34D" stroke-width="0.8" />
    <text x="140" y="280" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#92400E" text-anchor="middle">100% RAW &amp; COLD EXTRACTED</text>
    <text x="140" y="300" font-family="-apple-system, sans-serif" font-size="8" fill="#B45309" text-anchor="middle">Lamjung Terroir · 500g</text>
  </g>

  <text x="400" y="680" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#FDE68A" text-anchor="middle" letter-spacing="4">PURE MOUNTAIN HARVEST</text>
  <text x="400" y="708" font-family="-apple-system, sans-serif" font-size="11" fill="#D97706" text-anchor="middle" letter-spacing="2">TRADITIONAL CLIFF APICULTURE · NEPAL</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A261D" />
      <stop offset="100%" stop-color="#0E1610" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3B2F" />
      <stop offset="100%" stop-color="#1E2A20" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4E6558" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)" />
  <circle cx="400" cy="380" r="320" fill="url(#glow)" />

  <!-- Frame border -->
  <rect x="32" y="32" width="736" height="736" fill="none" stroke="#2D3B2F" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Coffee Pouch Vector Silhouette -->
  <g transform="translate(240, 150)">
    <!-- Main pouch body -->
    <path d="M 40 40 L 280 40 L 310 440 L 10 440 Z" fill="url(#bagGrad)" stroke="#4E6558" stroke-width="2" />
    <!-- Pouch top seal -->
    <rect x="30" y="20" width="260" height="24" rx="4" fill="#1B261D" stroke="#4E6558" stroke-width="1.5" />
    <!-- Seal ridges -->
    <line x1="50" y1="26" x2="50" y2="38" stroke="#4E6558" stroke-width="1" />
    <line x1="60" y1="26" x2="60" y2="38" stroke="#4E6558" stroke-width="1" />
    <line x1="70" y1="26" x2="70" y2="38" stroke="#4E6558" stroke-width="1" />
    <line x1="250" y1="26" x2="250" y2="38" stroke="#4E6558" stroke-width="1" />
    <line x1="260" y1="26" x2="260" y2="38" stroke="#4E6558" stroke-width="1" />
    <line x1="270" y1="26" x2="270" y2="38" stroke="#4E6558" stroke-width="1" />

    <!-- Paper Craft Label on Pouch -->
    <rect x="50" y="90" width="220" height="280" rx="6" fill="#F4F3F1" />
    <!-- Label inner border -->
    <rect x="58" y="98" width="204" height="264" rx="3" fill="none" stroke="#D8D4CD" stroke-width="1" />

    <!-- Coffee Emblem -->
    <circle cx="160" cy="150" r="26" fill="#14281D" />
    <path d="M 160 134 C 150 144, 150 156, 160 166 C 170 156, 170 144, 160 134 Z" fill="#F4F3F1" />
    <path d="M 160 138 C 163 147, 157 153, 160 162" stroke="#14281D" stroke-width="1.5" fill="none" />

    <!-- Label Typography -->
    <text x="160" y="200" font-family="Georgia, serif" font-size="11" font-weight="600" fill="#4E6558" text-anchor="middle" letter-spacing="3">BREWMELLOW</text>
    <text x="160" y="235" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#14281D" text-anchor="middle">Gulmi Reserve</text>
    <line x1="90" y1="252" x2="230" y2="252" stroke="#C2BDB5" stroke-width="0.8" />
    
    <text x="160" y="275" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#5C5954" text-anchor="middle" letter-spacing="1.5">SINGLE-ORIGIN ARABICA</text>
    <text x="160" y="295" font-family="-apple-system, sans-serif" font-size="9.5" fill="#78736B" text-anchor="middle">Aapchaur, Gulmi · 1,550m</text>
    <text x="160" y="315" font-family="-apple-system, sans-serif" font-size="9" fill="#78736B" text-anchor="middle">Washed Process · Medium Roast</text>

    <!-- Tasting Notes Pill -->
    <rect x="75" y="332" width="170" height="20" rx="10" fill="#E8E5DF" />
    <text x="160" y="346" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#3D3B37" text-anchor="middle">HONEY · GREEN APPLE · WALNUT</text>
  </g>

  <!-- Bottom Stamp -->
  <text x="400" y="680" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#DCE7E1" text-anchor="middle" letter-spacing="4">HIMALAYAN SPECIALTY COFFEE</text>
  <text x="400" y="708" font-family="-apple-system, sans-serif" font-size="11" fill="#7E9689" text-anchor="middle" letter-spacing="2">100% ORGANIC DIRECT TRADE · NEPAL</text>
</svg>
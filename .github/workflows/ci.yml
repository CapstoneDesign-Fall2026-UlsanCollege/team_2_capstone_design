name: CI

on:
  push:
    branches:
      - "saas/**"
      - "main"
  pull_request:
    branches:
      - "**"

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shopcraft_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-insecure-test-secret-key"
      FIELD_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      SHOPCRAFT_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shopcraft_test"
      SHOPCRAFT_ALLOW_DATABASE_URL: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django System Check
        run: |
          python backend/manage.py check

      - name: Verify Pending Migrations
        run: |
          python backend/manage.py makemigrations --check --dry-run

      - name: Run Migrations
        run: |
          python backend/manage.py migrate --noinput

      - name: Run Tests
        run: |
          python backend/manage.py test --verbosity 2

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    env:
      DJANGO_API_ORIGIN: "http://127.0.0.1:8000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: |
          npm --prefix frontend ci

      - name: Surface Boundary Check
        run: |
          if [ -f frontend/scripts/check-surfaces.mjs ]; then node frontend/scripts/check-surfaces.mjs; fi

      - name: ESLint
        run: |
          if [ -d "frontend/src/app/(platform)" ]; then npm --prefix frontend run lint -- "src/app/(platform)" "src/app/merchant" "src/app/s" "src/components/account" "src/components/auth" "src/lib"; else npm --prefix frontend run lint -- next.config.ts; fi

      - name: TypeScript Check
        run: |
          npm --prefix frontend run typecheck

      - name: Next.js Build
        run: |
          npm --prefix frontend run build
